name: mysql

services:
  mysql:
    image: mysql:8.0.35
    container_name: mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --character-set-client-handshake=FALSE
    environment:
      MYSQL_ROOT_PASSWORD: toor
    ports:
      - "3306:3306"
    volumes:
      - C:\software\mysql\data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u${MYSQL_ROOT_USER}",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
